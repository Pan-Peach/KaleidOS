# KABI schema — component：组件**导出**的生命周期入口面 + 契约指纹 + 接口分类。
#
# 生成物（提交物，不要手改；`make abi-gen` 重生成，`make abi-check` 校验）：
#   os/components/kcomp-sdk/include/generated/kcomp_abi.h   C 声明（extern 函数 / 对象 / typedef / enum）
#   os/components/kcomp-sdk/src/generated/abi.rs            SDK-Rust 镜像（type alias / const / enum）
#   os/core/src/generated/abi.rs                            Core 边界结构 / 常量
#
# 组件侧的 `kcomp_abi` **定义**仍由 SDK 的 `kcomp_instance_create!` 宏发出
# （本 schema 只声明 extern 符号，绝不生成定义）。

[[struct]]
name = "KcompRuntime"
c_name = "kcomp_runtime"
doc = """
Core 在业务 create 前交付的部署后端；只在初始化调用期间借用。
domain 使用 ExecutionDomain 的整数编码。仅 KernelNative 交付共享堆的
窄 C ABI 地址（alloc(size, align)，dealloc(ptr, size, align)）；私有域两个地址
必须为零，SDK 使用镜像内的私有分配器。不是分配器内部状态或跨域权限。
"""
size64 = 24
size32 = 16
[[struct.field]]
name = "domain"
type = "u32"
[[struct.field]]
name = "reserved"
type = "u32"
[[struct.field]]
name = "heap_alloc"
type = "usize"
[[struct.field]]
name = "heap_dealloc"
type = "usize"

[[entry]]
name = "kcomp_runtime_init"
alias = "KcompRuntimeInit"
doc = """
可选的 SDK 运行时入口；Core 在业务 create 前以实例身份调用一次。
返回 0 / -errno；失败按 create 失败处理，不进入业务 create。
组件业务不判断执行域；不携带 SDK 的无堆组件可省略此入口。
"""
ret = "i32"
targets = "c,sdk-rust"
[[entry.param]]
name = "runtime"
type = "*const KcompRuntime"

[[struct]]
name = "KcompCreateArgs"
c_name = "KcompCreateArgs"
doc = """
`kcomp_instance_create` 的参数：仅在调用期间借用。
`config` 必须拷贝后才能持久化；Core 视其为不透明字节。
"""
size64 = 24
size32 = 16
align = 8

[[struct.field]]
name = "config_abi"
type = "u64"
doc = "config 负载的精确指纹；0 = 无负载。"
offset = 0

[[struct.field]]
name = "config"
type = "*const void"
doc = "Core 视为不透明字节。"
offset = 8

[[struct.field]]
name = "config_len"
type = "usize"
offset64 = 16
offset32 = 12

[[struct]]
name = "KcompCallFrame"
c_name = "kcomp_call_frame"
doc = """
一次服务调用的**扁平 frame**：三个 `(ptr, len)` 对，六个字段全部指针宽
（`size_ptrs = 6`），因此 32/64 位布局一致、可跨执行域搬运；**没有嵌套
raw pointer** —— 标量参数编码在 `args` 的扁平字节区里，由 SDK 编解码。
`args` / `input` / `output` 指向调用方内存，仅在**本次调用期间**借用；Core
只做结构校验（长度非零时指针不得为空），**从不解析**其中的字节。
"""
size_ptrs = 6

[[struct.field]]
name = "args"
type = "*const u8"
doc = "标量参数区（字段布局 / 序号由契约的 SDK 侧定义，Core 视为不透明字节）。"

[[struct.field]]
name = "args_len"
type = "usize"

[[struct.field]]
name = "input"
type = "*const u8"
doc = "输入负载（只读）；无负载时指针可空、长度为 0。"

[[struct.field]]
name = "input_len"
type = "usize"

[[struct.field]]
name = "output"
type = "*mut u8"
doc = "输出负载（可写）；provider 写入量不得超过 `output_len`。"

[[struct.field]]
name = "output_len"
type = "usize"

[[entry]]
name = "kcomp_instance_create"
alias = "KcompInstanceCreate"
doc = """
组件实例创建入口（组件导出，Core 调用）。返回 0 / `-errno`。
Core 调用前把 `*out_state` 初始化为 NULL；成功时组件写入自己完成的 state 指针，
**无状态组件可以成功返回 NULL**（保持 NULL）。失败 / panic 走 Core 的 Failed
路径，且**不会**调用 destroy（构造期清理由组件自己负责）。
"""
ret = "i32"
targets = "c,sdk-rust"

[[entry.param]]
name = "args"
type = "*const KcompCreateArgs"

[[entry.param]]
name = "out_state"
type = "*mut *mut void"

[[entry]]
name = "kcomp_instance_destroy"
alias = "KcompInstanceDestroy"
doc = """
组件实例析构入口（组件导出，Core 调用）。返回 0 / `-errno`。
Core 对未完整构造 / panic 的实例不调用本入口；destroy 只做组件自己的
quiesce / 私有资源清理，Core 仍会兜底 revoke authority / unbind。
"""
ret = "i32"
targets = "c,sdk-rust"

[[entry.param]]
name = "state"
type = "*mut void"

[[entry]]
name = "kcomp_service_dispatch"
alias = "KcompServiceDispatch"
doc = """
**可选**的组件服务 dispatcher（组件导出，Core 调用）：image 级统一入口，
`port` 选中 provider 的哪个 endpoint，`method` 由 provider 定义。
`instance_state` 是 `kcomp_instance_create` 写回的 opaque state（可为 NULL）；
`frame` 是扁平 call frame，仅在本次调用期间借用。返回 provider 自己的
`0 / -errno` —— 它**不是** Core 的传输状态（见 `kcore_endpoint_call`）。
缺失该符号 = 组件不提供任何 endpoint 服务：加载不失败，调用返回 `-ENOSYS`。
"""
ret = "i32"
targets = "c,sdk-rust"

[[entry.param]]
name = "instance_state"
type = "*mut void"

[[entry.param]]
name = "port"
type = "u32"

[[entry.param]]
name = "method"
type = "u32"

[[entry.param]]
name = "frame"
type = "*const KcompCallFrame"

[[object]]
name = "kcomp_abi"
type = "u64"
const = true
doc = """
精确契约指纹（手工维护，非版本号）。Core 在调用组件代码前校验其 ELF 定义、
边界与值。组件必须定义 `const uint64_t kcomp_abi = ...;`——SDK 的
`kcomp_instance_create!` 宏会发出该定义（值 = Rust 镜像的 `KCOMP_ABI`）。
"""
targets = "c"

[[alias]]
name = "KcompTaskEntry"
c_name = "KcompTaskEntry"
doc = """
任务入口：`arg` 由 `kcore_task_create` 原样回传。
契约：entry 必须经 Core 退出（kcore_task_exit）；任务归属来自 Core 的执行
边界，**不是**来自 `arg`。
"""
ret = "void"
targets = "c,sdk-rust"

[[alias.param]]
name = "arg"
type = "*mut void"

[[enum]]
name = "InterfaceKind"
c_name = "KcompInterfaceKind"
repr = "u32"
c_style = "enum"
doc = "接口领域分类（与 docs/architecture/component-model.md §2 一致；ABI 编码 0/1/2）。"

[[enum.variant]]
name = "Device"
c_name = "KCOMP_IFACE_DEVICE"
value = 0

[[enum.variant]]
name = "Service"
c_name = "KCOMP_IFACE_SERVICE"
value = 1

[[enum.variant]]
name = "Policy"
c_name = "KCOMP_IFACE_POLICY"
value = 2

[[const]]
name = "KCOMP_ABI"
type = "u64"
value = "0x47AF_93E6_21B8_D054"
doc = """
精确契约指纹（手工维护，非版本号）：Core 在调用组件代码前校验其 ELF 定义、
边界与值。指纹包含当前 Core import 契约；签名变动须协调替换并重建全部组件。组件里的
`kcomp_abi` 符号由入口宏发出。
"""
targets = "sdk-rust,core-rust"
