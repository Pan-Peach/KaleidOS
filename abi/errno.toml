# KABI schema — errno：ABI 错误码的唯一来源。
#
# 生成物（提交物，不要手改；`make abi-gen` 重生成，`make abi-check` 校验）：
#   os/components/kcomp-sdk/include/generated/errno.h   C（#define）
#   os/components/kcomp-sdk/src/generated/errno.rs      SDK-Rust（enum + code/from_code/name）
#   os/core/src/generated/errno.rs                      Core-Rust（enum）
#
# 手写部分（facade / umbrella / Display / From 映射 / status）不在本文件范围内。

[[enum]]
name = "Errno"
repr = "i32"
c_style = "defines"
# 未知负码（Core 新加、SDK 未同步）在 SDK 侧解码回退到的变体。
decode_fallback = "EIO"
doc = """
稳定、Linux/POSIX 风格的 ABI 错误码。**完整的 `asm-generic/errno` 集合**
（1–133；未使用的 41 / 58 留空；95 的 POSIX 别名 `EOPNOTSUPP` 与
`ENOTSUP` 同码，不再单列）。进入 public ABI 后数字不再变更。
本文件是唯一来源：Core / SDK / C 三份错误码由此生成（tools/kabi/kabi_gen.py）。
"""

