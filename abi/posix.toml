# Minimal process-family profile. Config is an immutable named ELF snapshot;
# it is not VFS, a Linux syscall ABI, or a general filesystem namespace.
# Header LE u32 image_count/argc/envc/reserved, followed by image records:
# u32 name_len, u32 image_len, name bytes, image bytes; then argc/envc records
# u32 len + bytes. No NULs in names/strings; no trailing bytes. Maximum 8 images,
# 128 strings, 16 MiB total. First image is initial program. Ownership is copied.
[[struct]]
name = "PosixCreateConfig"
c_name = "kcomp_posix_create_config"
size = 16
align = 4
targets = "c,sdk-rust"
doc = "LE fixed header followed by bounded image/argv/envp records."
[[struct.field]]
name = "image_count"
type = "u32"
offset = 0
[[struct.field]]
name = "argc"
type = "u32"
offset = 4
[[struct.field]]
name = "envc"
type = "u32"
offset = 8
[[struct.field]]
name = "reserved"
type = "u32"
offset = 12

[[const]]
name = "KCOMP_POSIX_CREATE_CONFIG_ABI"
type = "u64"
value = "0x504F_5349_5849_4D47"
targets = "c,sdk-rust"
doc = "Exact immutable-image config fingerprint. Old VFS-only skeleton config rejected."
[[const]]
name = "KCOMP_POSIX_CREATE_CONFIG_LEN"
type = "usize"
value = "16"
targets = "c,sdk-rust"
doc = "Minimum header length; records follow."
[[const]]
name = "KCOMP_POSIX_PROCESS_NAME"
type = "string"
value = "posix.process"
targets = "c,sdk-rust"
[[const]]
name = "KCOMP_POSIX_PROCESS_CONTRACT"
type = "u64"
value = "0x504F_5349_5850_524F"
targets = "c,sdk-rust"
[[const]]
name = "KCOMP_POSIX_PROCESS_ABI"
type = "u64"
value = "0x5052_4F43_4950_4353"
targets = "c,sdk-rust"
doc = "IPC family status and explicit shutdown; no cross-component function table."

[[method]]
name = "status"
id = 0
symbol = "KCOMP_POSIX_METHOD_STATUS"
[[method.reply]]
name = "exited"
type = "u32"
[[method.reply]]
name = "wait_status"
type = "u32"
[[method.reply]]
name = "live"
type = "u32"

[[method]]
name = "shutdown"
id = 1
symbol = "KCOMP_POSIX_METHOD_SHUTDOWN"
