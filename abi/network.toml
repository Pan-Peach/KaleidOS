# KABI schema — network：TCP / UDP 网络服务骨架，尚未实现。
# docs/interfaces/network.md 定义语义；本文件是布局 / 数值 / method 的唯一来源。
# 方法返回 0 / -errno；尝试操作的 -EAGAIN = Pending；-EBUSY = 同步点竞争，未执行。
# 所有指针只借用本次调用；Rust 对象 / enum / smoltcp 类型均不跨边界。
# Future service uses generated IPC LE codecs, no business function table.
# No network endpoint or IPC handler is implemented yet.

[[struct]]
name = "NetworkAddress"
c_name = "kcomp_network_address"
size = 24
align = 8
targets = "c,sdk-rust"
doc = "family 4/6；family=0 表示缺省字段且其余为零。flags=1 为本地 wildcard，IP 两半为零；其他 flags 拒绝。IPv6 为高低各 64 位整数；IPv4 用 ip_low 低 32 位，其余零。最高有效位是地址首位；IPC 各整数 LE 编码，port 也是整数。"

[[struct.field]]
name = "family"
type = "u32"
offset = 0

[[struct.field]]
name = "port"
type = "u16"
offset = 4

[[struct.field]]
name = "flags"
type = "u16"
offset = 6

[[struct.field]]
name = "ip_high"
type = "u64"
offset = 8

[[struct.field]]
name = "ip_low"
type = "u64"
offset = 16

[[struct]]
name = "NetworkSocketInfo"
c_name = "kcomp_network_socket_info"
size = 48
align = 8
targets = "c,sdk-rust"
doc = "端点快照；protocol TCP=1 / UDP=2，interface=0 表示未限定接口，reserved=0。"

[[struct.field]]
name = "id"
type = "u64"
offset = 0

[[struct.field]]
name = "protocol"
type = "u32"
offset = 8

[[struct.field]]
name = "family"
type = "u32"
offset = 12

[[struct.field]]
name = "local"
type = "NetworkAddress"
offset = 16

[[struct.field]]
name = "interface"
type = "u32"
offset = 40

[[struct.field]]
name = "reserved"
type = "u32"
offset = 44

[[struct]]
name = "NetworkEvents"
c_name = "kcomp_network_events"
size = 16
align = 8
targets = "c,sdk-rust"
doc = "flags：RX=1、TX capacity=2、accept=4、closed=8。revision 也覆盖连接完成、失败与方向结束，reserved=0。"

[[struct.field]]
name = "revision"
type = "u64"
offset = 0

[[struct.field]]
name = "flags"
type = "u32"
offset = 8

[[struct.field]]
name = "reserved"
type = "u32"
offset = 12

[[struct]]
name = "NetworkTcpStatus"
c_name = "kcomp_network_tcp_status"
size = 64
align = 8
targets = "c,sdk-rust"
doc = "phase：Idle=0、Connecting=1、Established=2、Listening=3、Closing=4、Closed=5；flags：send_finished=1、receive_ended=2；failure=0 或持久的负 errno；reserved=0。"

[[struct.field]]
name = "phase"
type = "u32"
offset = 0

[[struct.field]]
name = "flags"
type = "u32"
offset = 4

[[struct.field]]
name = "failure"
type = "i32"
offset = 8

[[struct.field]]
name = "reserved"
type = "u32"
offset = 12

[[struct.field]]
name = "local"
type = "NetworkAddress"
offset = 16

[[struct.field]]
name = "peer"
type = "NetworkAddress"
offset = 40

[[struct]]
name = "NetworkStreamRead"
c_name = "kcomp_network_stream_read"
size = 8
align = 4
targets = "c,sdk-rust"
doc = "count 不大于 buffer；end 为 0/1，end=1 时 count=0。零长读 count=0 / end=0，不消费 EOF。"

[[struct.field]]
name = "count"
type = "u32"
offset = 0

[[struct.field]]
name = "end"
type = "u32"
offset = 4

[[struct]]
name = "NetworkDatagram"
c_name = "kcomp_network_datagram"
size = 64
align = 8
targets = "c,sdk-rust"
doc = "实际包地址与长度。consumed 只能为 0/1；copied 不大于 buffer 或 original_len，零长度包合法。"

[[struct.field]]
name = "source"
type = "NetworkAddress"
offset = 0

[[struct.field]]
name = "destination"
type = "NetworkAddress"
offset = 24

[[struct.field]]
name = "interface"
type = "u32"
offset = 48

[[struct.field]]
name = "copied"
type = "u32"
offset = 52

[[struct.field]]
name = "original_len"
type = "u32"
offset = 56

[[struct.field]]
name = "consumed"
type = "u32"
offset = 60

