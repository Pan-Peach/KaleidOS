# KABI schema — network：TCP / UDP 网络服务骨架，尚未实现。
# docs/interfaces/network.md 定义语义；本文件是布局 / 数值 / method 的唯一来源。
# 方法返回 0 / -errno；尝试操作的 -EAGAIN = Pending；-EBUSY = 同步点竞争，未执行。
# 所有指针只借用本次调用；Rust 对象 / enum / smoltcp 类型均不跨边界。
# Gate 逐字段 LE 编码，无 padding；Direct 用 C table。未知值 / reserved 拒绝。

[[struct]]
name = "NetworkAddress"
c_name = "kcomp_network_address"
size = 24
align = 8
targets = "c,sdk-rust"
doc = "family 4/6；family=0 表示缺省字段且其余为零。flags=1 为本地 wildcard，IP 两半为零；其他 flags 拒绝。IPv6 为高低各 64 位整数；IPv4 用 ip_low 低 32 位，其余零。最高有效位是地址首位；Gate 各整数 LE 编码，port 也是整数。"

[[struct.field]]
name = "family"
type = "u32"
offset = 0

[[struct.field]]
name = "port"
type = "u16"
offset = 4

[[struct.field]]
name = "flags"
type = "u16"
offset = 6

[[struct.field]]
name = "ip_high"
type = "u64"
offset = 8

[[struct.field]]
name = "ip_low"
type = "u64"
offset = 16

