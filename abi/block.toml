# BlockDevice Endpoint Request/Reply protocol. One generated C/Rust protocol.
[[const]]
name = "KCOMP_BLOCK_DEVICE_NAME"
type = "string"
value = "block.device"
targets = "c,sdk-rust"
doc = "接口的稳定名字（publish / bind 必须逐字节一致）。"

[[const]]
name = "KCOMP_BLOCK_DEVICE_ABI"
type = "u64"
value = "0x424C_4B49_5043_524F"
targets = "c,sdk-rust"
doc = "exact ABI fingerprint：8 字节 ASCII \"BLKIPCRO\" 的大端读数。"

[[const]]
name = "KCOMP_BLOCK_DEVICE_SECTOR"
type = "usize"
value = "512"
targets = "c,sdk-rust"
doc = "契约单位：1 sector = 512 字节（`read` / `write` 的 `len` 必须是它的整数倍）。"

[[const]]
name = "KCOMP_BLOCK_DEVICE_CONTRACT"
type = "u64"
value = "0x424C_4B43_4F4E_5452"
targets = "c,sdk-rust"
doc = """
`block.device` 的 endpoint 契约身份（组合策略提供的不透明 `u64`；
`kcore_endpoint_lookup` / `kcore_endpoint_validate` 的 `contract` 参数）。
数值 = 8 字节 ASCII tag `b"BLKCONTR"` 的大端读数（与 ABI 指纹同一约定）。
"""

[[method]]
name = "capacity_sectors"
id = 0
symbol = "KCOMP_BLOCK_METHOD_CAPACITY"
infallible = true
[[method.reply]]
name = "sectors"
type = "u64"

[[method]]
name = "read"
id = 1
symbol = "KCOMP_BLOCK_METHOD_READ"
[[method.args]]
name = "lba"
type = "u64"
[method.output]
min = 512
max = 512

[[method]]
name = "write"
id = 2
symbol = "KCOMP_BLOCK_METHOD_WRITE"
[[method.args]]
name = "lba"
type = "u64"
[method.input]
min = 512
max = 512

[[const]]
name = "KCOMP_BLOCK_LBA_LEN"
type = "usize"
value = "8"
targets = "c,sdk-rust"
doc = "`read` / `write` 的 `args` 区长度：一个 LE `u64` lba（没有其它编码）。"

[[const]]
name = "KCOMP_BLOCK_CAPACITY_LEN"
type = "usize"
value = "8"
targets = "c,sdk-rust"
doc = "`capacity` 的 `output` 区长度：一个 LE `u64`（sector 数）。"
