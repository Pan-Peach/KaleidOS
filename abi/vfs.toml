# KABI schema — vfs：第一阶段只读 Namespace / File service。
# 分层契约见 docs/interfaces/filesystem.md；逐方法编码见 docs/interfaces/vfs.md。
#
# Rust 内部对象 / enum / 引用不跨边界；仅使用 Request/Reply 的 LE 扁平编码。
# Core 按真实 Task/domain/grant 验证 IPC，不发布 Direct table/Gate dispatcher。
# 方法状态保持 0 / -errno。额外 domain-status 放 VfsReplyStatus / Gate 回复头，
# 用于保留 sharing / delete-pending 等信息。传输失败仍是 Core 的独立 -errno。
# 所有 ID 只在发布此 endpoint 的 VFS 实例内有效，不是权限，也不跨重启复用。
# 所有 reserved 必须为 0，未知 flag / 编码拒绝；调用者缓冲区只借用本次调用。
# schema 改变布局或语义时必须原地更换 exact ABI fingerprint，不能保留旧名。

[[struct]]
name = "VfsReplyStatus"
c_name = "kcomp_vfs_reply_status"
size = 8
align = 4
targets = "c,sdk-rust"
doc = "每次正常回复均有效；domain 0 = 无额外分类，非零值见 STATUS 常量；reserved 必须为 0。成功时 domain 必须为 0。"

