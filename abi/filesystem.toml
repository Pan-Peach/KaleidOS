# KABI schema — filesystem：只读文件系统服务契约（provider: fatfs 等；
# consumer: 未来的 VFS）。
#
# 生成物（提交物，不要手改；`make abi-gen` 重生成，`make abi-check` 校验）：
#   os/components/kcomp-sdk/include/generated/kcomp_abi.h   C 结构 / 常量 + 布局 _Static_assert
#   os/components/kcomp-sdk/src/generated/filesystem.rs     SDK-Rust 镜像 + `const _` 布局断言
#
# 手写部分（facade，不在本文件范围）：契约类型 `FileSystem` / provider wrapper
# （`kcomp-sdk/src/filesystem.rs` + `filesystem/`）、C 前端
# （`include/kcomp_filesystem.h` + `c/kcomp_filesystem.c`）、`InterfaceAbi`
# newtype（`binding.rs`）。
# 组件间契约**不是** Core 导出：Core 只把 publish 进来的 api / ctx 当不透明指针
# 存着，不认识契约语义，所以名字是 `kcomp_*`（组件面），不是 `kcore_*`。
#
# 与 block.device 同构：**同一个 ABI 指纹下两种 transport**。
#   - Direct：`FileSystemApi`（`#[repr(C)]` function table）——endpoint 发布时
#     作为 api / ctx 交付，同域调用方直接调 table（机制见
#     os/components/kcomp-sdk/src/filesystem/service.rs）；
#   - Gate  ：本文件定义的**扁平方法编码**——跨域 / 受控绑定经
#     `kcore_endpoint_call` 调用 provider 的 `kcomp_service_dispatch`。
# **机制由 Core 在 bind 时按两端执行域选定**；provider 两种都提供、不选择。
#
# Endpoint 调用路径（`kcore_endpoint_call`，method 语义由本契约定义）：
#
#   mount(0)  ：args 空、input 空、output 空 → 0 / -errno
#   unmount(1)：args 空、input 空、output 空 → 0 / -errno
#   open(2)   ：args 恰好 4 字节（LE `u32` flags）、input = NUL 结尾的路径字节
#               （**含**结尾 NUL；长度 1..=PATH_MAX；结尾 NUL 必须是路径中唯一的
#               NUL）、output 恰好 8 字节（LE `u64` handle）
#   close(3)  ：args 恰好 8 字节（LE `u64` handle）、input 空、output 空
#   read(4)   ：args 恰好 8 字节（LE `u64` handle）、input 空、output ≥ 8 字节：
#               前 8 字节 = LE `u64` 实际读取长度（**仅当方法返回 0 时有效**），
#               随后是数据区（容量 = `output_len` - 8；`output_len` **含** 8 字节头）
#   root(5)   ：args 空、input 空、output 恰好 8 字节 LE u64 node token
#   lookup(6) ：args 恰好 12 字节（LE u64 parent + LE u32 encoding）、
#               input = 单个名字（无 NUL，1..=NAME_MAX 字节）、output = 8 字节 LE u64 node
#   node_info(7)：args = 8 字节 LE u64 node、input 空、output = 4 字节 LE u32 kind
#
# 节点 token 在本 provider 的本次挂载期间有效；0 无效，重复 lookup 同一对象
# 返回相同 token。成功 unmount 后全部失效，重新 mount 不复用旧 token。
# token 仅在所属 provider 实例内有意义；调用方不得把 token 换给另一实例。
# 当前只读节点表要求介质在挂载期间不被外部修改；不提供介质热替换语义。
# node 与 open handle 是独立身份。节点表容量由 provider 决定，耗尽返回 ENOSPC。
# lookup 只查 parent 的一个子名字；空名、NUL、分隔符、. / .. 返回 EINVAL。
# encoding 不支持或字符不可表示返回 ENOTSUP；不存在返回 ENOENT；过期 token
# 返回 EBADF；非目录 parent 返回 ENOTDIR；未挂载 / 已停止返回 ENODEV。
# 无节点能力的 provider 对 root / lookup / node_info 返回 ENOTSUP。
#
# 为什么 `read` 需要一个 8 字节头：扁平 frame 的 `output` 是**一个** caller 数据
# 区，无法同时表达"数据 buffer"与"out 参数"（旧 table 的 `out_read`）；实际长度
# 因此编码在数据前面。Direct 路径不用 frame（参数就是普通 C 参数），语义逐方法一致。
#
# 路径字节是**有界的**：provider 把 input 拷进自己的定长 scratch
# （`KCOMP_FILESYSTEM_PATH_MAX`）再交给业务后端，**绝不保留、绝不改写** caller
# 内存。框外的路径（空 / 超长 / 结尾无 NUL / 内部 NUL）→ `-EINVAL`，业务后端不被
# 调用。
#
# 方法号 / 长度 / contract 身份都是本文件生成的常量（C / SDK-Rust 同源）。

[[struct]]
name = "FileSystemApi"
c_name = "kcomp_filesystem_api"
size_ptrs = 8
doc = """
`filesystem` provider/consumer function table（**Direct** transport 的共享布局）。

同一个 ABI 指纹下的另一种 transport（Gate / 扁平方法编码）见 `abi/filesystem.toml`
头部的 Endpoint 调用路径说明：provider 的 `kcomp_service_dispatch` 按 `method`
分派到同一份业务后端（就是本 table 的方法）；两条 transport 的语义逐方法一致。

第一阶段刻意保持最小、只读：provider 把实现对象保持私有，caller 只拿到不透明的
u64 file handle 与节点 token（provider 侧具体格式如 FatFs 对 caller 不可见）。
"""

[[struct.field]]
name = "mount"
type = "fn(ctx: *mut void) -> i32"
doc = "挂载该 filesystem 实例（provider 自己决定具体语义）。"

[[struct.field]]
name = "unmount"
type = "fn(ctx: *mut void) -> i32"
doc = "卸载该 filesystem 实例。"

[[struct.field]]
name = "open"
type = "fn(ctx: *mut void, path: *const char, flags: u32, out_handle: *mut u64) -> i32"
doc = "`path` 是以 NUL 结尾的、相对于该 filesystem root 的路径；`flags` 见 `KCOMP_FILESYSTEM_OPEN_READ`。"

[[struct.field]]
name = "close"
type = "fn(ctx: *mut void, handle: u64) -> i32"
doc = "关闭一个 open 返回的 handle。"

[[struct.field]]
name = "read"
type = "fn(ctx: *mut void, handle: u64, buf: *mut u8, len: usize, out_read: *mut usize) -> i32"
doc = "从 handle 当前位置读 `len` 字节；实际读到的字节数写回 `out_read`。"

[[struct.field]]
name = "root"
type = "fn(ctx: *mut void, out_node: *mut u64) -> i32"
doc = "返回当前 FS 实例的根节点 token。"

[[struct.field]]
name = "lookup"
type = "fn(ctx: *mut void, parent: u64, name: *const u8, name_len: usize, encoding: u32, out_node: *mut u64) -> i32"
doc = "在目录 parent 中查找名字，返回节点 token。"

[[struct.field]]
name = "node_info"
type = "fn(ctx: *mut void, node: u64, out_kind: *mut u32) -> i32"
doc = "查询节点的类型等元数据。"

[[const]]
name = "KCOMP_FILESYSTEM_NAME"
type = "string"
value = "filesystem"
targets = "c,sdk-rust"
doc = "filesystem 服务的稳定 endpoint 名字（publish / bind 必须逐字节一致）。"

[[const]]
name = "KCOMP_FILESYSTEM_ABI"
type = "u64"
value = "0x4653_4E4F_4445_524F"
targets = "c,sdk-rust"
doc = "exact ABI fingerprint（8 字节 ASCII \"FSNODERO\" 的大端读数）。"

[[const]]
name = "KCOMP_FILESYSTEM_OPEN_READ"
type = "u32"
value = "0x00000001"
targets = "c,sdk-rust"
doc = "第一阶段只读文件访问。flags 是 ABI 编码，不直接暴露 FatFs 的 FA_*。"

[[const]]
name = "KCOMP_FILESYSTEM_CONTRACT"
type = "u64"
value = "0x5646_5343_4F4E_5452"
targets = "c,sdk-rust"
doc = """
`filesystem` 的 endpoint 契约身份（组合策略提供的不透明 `u64`；
`kcore_endpoint_lookup` / `kcore_endpoint_validate` / `kcore_endpoint_bind` 的
`contract` 参数）。数值 = 8 字节 ASCII tag `b"VFSCONTR"` 的大端读数（与 block 的
`BLKCONTR` 同一约定）。**契约身份与 ABI 指纹是两个不同的值**：前者标识"哪个
endpoint 契约"，后者标识"function table / 扁平编码的逐位布局"。
"""

