# Filesystem Endpoint Request/Reply protocol; all providers publish IPC-only.
# Nodes and open handles stay private to each provider, never in Core.
# Handwritten handlers enforce resource ownership, native names and cancellation.
[[const]]
name = "KCOMP_FILESYSTEM_NAME"
type = "string"
value = "filesystem"
targets = "c,sdk-rust"
doc = "filesystem 服务的稳定 endpoint 名字（publish / bind 必须逐字节一致）。"

[[const]]
name = "KCOMP_FILESYSTEM_ABI"
type = "u64"
value = "0x4653_4950_4352_4F31"
targets = "c,sdk-rust"
doc = "exact ABI fingerprint（8 字节 ASCII \"FSIPCRO1\" 的大端读数）。"

[[const]]
name = "KCOMP_FILESYSTEM_OPEN_READ"
type = "u32"
value = "0x00000001"
targets = "c,sdk-rust"
doc = "第一阶段只读文件访问。flags 是 ABI 编码，不直接暴露 FatFs 的 FA_*。"

[[const]]
name = "KCOMP_FILESYSTEM_CONTRACT"
type = "u64"
value = "0x5646_5343_4F4E_5452"
targets = "c,sdk-rust"
doc = """
`filesystem` 的 endpoint 契约身份（组合策略提供的不透明 `u64`；
`kcore_endpoint_lookup` / `kcore_endpoint_validate` / `kcore_endpoint_bind` 的
`contract` 参数）。数值 = 8 字节 ASCII tag `b"VFSCONTR"` 的大端读数（与 block 的
`BLKCONTR` 同一约定）。**契约身份与 ABI 指纹是两个不同的值**：前者标识"哪个
endpoint 契约"，后者标识"IPC Wire 协议的逐位布局"。
"""

[[const]]
name = "KCOMP_FILESYSTEM_HANDLE_LEN"
type = "usize"
value = "8"
targets = "c,sdk-rust"
doc = "`read` / `close` 的 `args` 区与 `open` 的 `output` 区长度：一个 LE `u64` handle（没有其它编码）。"

[[const]]
name = "KCOMP_FILESYSTEM_FLAGS_LEN"
type = "usize"
value = "4"
targets = "c,sdk-rust"
doc = "`open` 的 `args` 区长度：一个 LE `u32` flags（没有其它编码）。"

[[const]]
name = "KCOMP_FILESYSTEM_READ_HEADER_LEN"
type = "usize"
value = "8"
targets = "c,sdk-rust"
doc = "`read` 的 `output` 头部长度：一个 LE `u64` 实际读取长度；数据从 offset 8 开始。"

[[const]]
name = "KCOMP_FILESYSTEM_PATH_MAX"
type = "usize"
value = "256"
targets = "c,sdk-rust"
doc = "`open` 的 `input` 上限（**含**结尾 NUL）：provider 用定长 scratch 拷贝路径，超过即 `-EINVAL`。"

[[const]]
name = "KCOMP_FILESYSTEM_NODE_FILE"
type = "u32"
value = "1"
targets = "c,sdk-rust"

[[const]]
name = "KCOMP_FILESYSTEM_NODE_DIRECTORY"
type = "u32"
value = "2"
targets = "c,sdk-rust"

[[const]]
name = "KCOMP_FILESYSTEM_LOOKUP_ARGS_LEN"
type = "usize"
value = "12"
targets = "c,sdk-rust"

[[const]]
name = "KCOMP_FILESYSTEM_NAME_MAX"
type = "usize"
value = "255"
targets = "c,sdk-rust"

[[const]]
name = "KCOMP_FILESYSTEM_ENCODING_BYTES"
type = "u32"
value = "1"
targets = "c,sdk-rust"
doc = "原生名字字节；FatFs lookup 当前仅支持 ASCII 8.3，大小写不敏感。"

