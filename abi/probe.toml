# KABI schema — probe：**无环的 prober → driver 分发**（step 4）。
#
# 旧模型里 driver 在**自己的 create 中回调 prober**（`driver.prober` 服务：
# `next_assignment` / `report_attempt`）——那形成同步重入环，与 endpoint 调用模型
# 的 re-entry 门禁直接冲突。本文件定义取代它的两个无环契约面：
#
#   1. `DriverCreateConfig`：**flat bytes，无嵌套指针**——assignment 数据经
#      `kcore_component_create` 的 `KcompCreateArgs.config` 进入 driver 的 create；
#      driver 绝不回调 prober。
#   2. `probe.result` endpoint：driver 在 create 期间 staged publish 的结果端口；
#      prober 在 create 返回 0 之后**拉取一次**（`kcore_endpoint_call`，Gate 路径），
#      然后用自己的普通函数调用更新自己的 cursor。
#
# 生成物（提交物，不要手改；`make abi-gen` 重生成，`make abi-check` 校验）：
#   os/components/kcomp-sdk/include/generated/kcomp_abi.h   C 声明 + 布局 _Static_assert
#   os/components/kcomp-sdk/src/generated/probe.rs           SDK-Rust 镜像 + `const _` 断言
#
# 手写部分（facade，不在本文件范围）：SDK 的 `DriverCreateConfig` 编解码、
# `ProbeReply`、`ProbeResult` 契约类型、pull/publish helper（`kcomp-sdk/src/probe.rs`）。
#
# ---------------------------------------------------------------------------
# DriverCreateConfig（`KCOMP_DRIVER_CREATE_CONFIG_ABI` 的 config 负载）
# ---------------------------------------------------------------------------
#
# 扁平字节布局，**总长恰好 `8 + N`**（没有终止符、没有对齐填充、没有嵌套指针）：
#
#   offset 0 : device_id        u32 LE   —— prober 分配的候选设备**选择数据**（不是权限）
#   offset 4 : endpoint_name_len u32 LE  —— 结果端口名字节数 N
#   offset 8 : endpoint_name     bytes   —— 结果端口名（无 NUL）；1 <= N <= 256
#
# 校验（两侧都做；prober 构造、driver 解析）：
#   - `config_abi` 必须逐位等于 `KCOMP_DRIVER_CREATE_CONFIG_ABI`；
#   - `config_len` 必须恰好 = `8 + endpoint_name_len`，且 1 <= N <= 256；
#   - `endpoint_name` 必须**不等于**保留的契约名 `KCOMP_PROBE_RESULT_NAME`
#     （driver 的结果端口名由 prober 按 attempt 生成，见 SDK 的
#     `result_port_name`；保留名不得被动态名字占用）。
# 任何一条不成立 → driver create 返回 `-EINVAL`（construction failure）。
#
# `DeviceId` 是选择数据：driver 在自己的 create 身份下 `kcore_device_claim`，
# prober 不 claim / 不 release / 不读寄存器。
#
# ---------------------------------------------------------------------------
# probe.result（`KCOMP_PROBE_RESULT_CONTRACT` 的 endpoint）
# ---------------------------------------------------------------------------
#
# method 语义（`kcore_endpoint_call` 的扁平 frame；Gate 路径）：
#
#   RESULT(0)：args 空、input 空、output **恰好 8 字节**：
#              outcome : i32 LE  —— 0 = Match，1 = NoMatch，<0 = 创建失败（value = -Errno）
#              detail  : u32 LE  —— 驱动定义的观测值（Match/NoMatch 时为设备身份读数等）
#              返回 0 / -errno（方法状态，不是传输状态）。
#
# 该契约**只有 Gate transport**：结果只在 create 返回 0 之后被拉取一次，不需要
# Direct function table（publish 时 `api` 允许为空）。prober 不 bind，直接调
# `kcore_endpoint_call`；任何绑定路径若选 Direct，Core 会以 `-ENOTSUP` 显式拒绝，
# **绝不静默降级**。
#
# 结果**按实例**保存（driver 的 create 写进自己的 instance state，经
# `kcomp_service_dispatch` 回放）——不得是组件全局的“最后一次结果”。

[[struct]]
name = "KcompDriverCreateConfig"
c_name = "kcomp_driver_create_config"
doc = """
`DriverCreateConfig` 的**固定头部**（本文件顶部定义完整布局）：

```text
offset 0 : device_id         u32 LE
offset 4 : endpoint_name_len u32 LE
offset 8 : endpoint_name     bytes（长度 = endpoint_name_len，无 NUL）
```

`endpoint_name` 字节**紧随本结构之后**（offset 8），总长恰好
`KCOMP_DRIVER_CREATE_HEADER_LEN + endpoint_name_len`。结构本身无指针、无填充，
32/64 位布局一致；跨执行域可安全搬运（整个 config 只是字节）。
"""
size = 8
align = 4

[[struct.field]]
name = "device_id"
type = "u32"
offset = 0
doc = "prober 分配的候选设备（**选择数据，不是权限**）；driver 在自己 create 里 claim。"

[[struct.field]]
name = "endpoint_name_len"
type = "u32"
offset = 4
doc = "`probe.result` 结果端口名长度 N（1 <= N <= `KCOMP_DRIVER_CREATE_NAME_MAX`）。"

[[const]]
name = "KCOMP_DRIVER_CREATE_CONFIG_ABI"
type = "u64"
value = "0x4452_5643_4F4E_4647"
targets = "c,sdk-rust"
doc = """
`KcompCreateArgs.config_abi` 的精确指纹（8 字节 ASCII `b"DRVCONFG"` 的大端读数；
与 `KCOMP_ABI` 同一约定）。对不上 = config 负载不是本布局 → driver 拒绝 create。
"""

[[const]]
name = "KCOMP_DRIVER_CREATE_HEADER_LEN"
type = "usize"
value = "8"
targets = "c,sdk-rust"
doc = "固定头部长度（device_id + endpoint_name_len，两个 LE `u32`）。"

[[const]]
name = "KCOMP_DRIVER_CREATE_DEVICE_ID_OFFSET"
type = "usize"
value = "0"
targets = "c,sdk-rust"
doc = "`device_id`（u32 LE）的偏移。"

[[const]]
name = "KCOMP_DRIVER_CREATE_NAME_LEN_OFFSET"
type = "usize"
value = "4"
targets = "c,sdk-rust"
doc = "`endpoint_name_len`（u32 LE）的偏移。"

[[const]]
name = "KCOMP_DRIVER_CREATE_NAME_OFFSET"
type = "usize"
value = "8"
targets = "c,sdk-rust"
doc = "`endpoint_name` 字节区（无 NUL）的偏移。"

[[const]]
name = "KCOMP_DRIVER_CREATE_NAME_MAX"
type = "usize"
value = "256"
targets = "c,sdk-rust"
doc = "结果端口名长度上限 N（与 `KCOMP_DRIVER_CREATE_HEADER_LEN` 相加 = 配置总长上限）。"

[[const]]
name = "KCOMP_PROBE_RESULT_NAME"
type = "string"
value = "probe.result"
targets = "c,sdk-rust"
doc = """
`probe.result` 契约的**保留 endpoint 名**。动态结果端口名（prober 按 attempt
生成）必须与它不同——保留名不得被动态名字占用。
"""

[[const]]
name = "KCOMP_PROBE_RESULT_ABI"
type = "u64"
value = "0x5052_4F42_5253_4C54"
targets = "c,sdk-rust"
doc = "exact ABI fingerprint（8 字节 ASCII \"PROBRSLT\" 的大端读数）。"

[[const]]
name = "KCOMP_PROBE_RESULT_CONTRACT"
type = "u64"
value = "0x5052_4243_4F4E_5452"
targets = "c,sdk-rust"
doc = """
`probe.result` 的 endpoint 契约身份（`kcore_endpoint_lookup` / `_validate` 的
`contract` 参数）。数值 = 8 字节 ASCII tag `b"PRBCONTR"` 的大端读数（与
`BLKCONTR` / `VFSCONTR` 同一约定）。
"""

[[const]]
name = "KCOMP_PROBE_RESULT_METHOD_RESULT"
type = "u32"
value = "0"
targets = "c,sdk-rust"
doc = "`RESULT` 的方法号：args 空 / input 空 / output 恰好 `KCOMP_PROBE_RESULT_OUTPUT_LEN`。"

[[const]]
name = "KCOMP_PROBE_RESULT_OUTPUT_LEN"
type = "usize"
value = "8"
targets = "c,sdk-rust"
doc = "`RESULT` 的 output 长度：`outcome` i32 LE + `detail` u32 LE。"

[[const]]
name = "KCOMP_PROBE_OUTCOME_MATCH"
type = "i32"
value = "0"
targets = "c,sdk-rust"
doc = "结果 outcome：driver 接受该设备（attach + publication 均已成功）。"

[[const]]
name = "KCOMP_PROBE_OUTCOME_NO_MATCH"
type = "i32"
value = "1"
targets = "c,sdk-rust"
doc = "结果 outcome：driver 检查后拒绝该设备（无残留 claim、无 block endpoint）。"
