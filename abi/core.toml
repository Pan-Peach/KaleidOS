[[function]]
name = "kcore_endpoint_lookup"
ret = "i32"
category = "Component endpoints（Contract / Endpoint）"
c_category = "Component endpoints（Contract / Endpoint）"
doc = """
组合期发现：`(provider, port_name, contract) → EndpointId`。
Core 校验的只有 **contract + 存活**（endpoint `Live` + owner 存在且 `Ready`）——
**不校验 abi**（本 ABI 不携带 abi）。交付的 EndpointId 是 opaque capability，
它的 abi 由 consumer 用 `kcore_endpoint_validate` 自行核对（SDK 的
`Endpoint<C>::from_id` / `lookup` 正是这样做的）。
成功 = `0`，EndpointId（`u64`）写入 `*out_endpoint`（调用方保证可写，任意对齐）；
失败 = `-Errno`（`EFAULT` out 为空 / `EINVAL` 名字非法·契约不符 /
`ENOENT` 未发布或 endpoint 已死 / `ENODEV` provider 已不存在）。
"""
c_doc = """
按 (provider, port_name, contract) 发现 endpoint：只校验 contract + 存活，
**不校验 abi**（id 是 opaque capability，abi 用 kcore_endpoint_validate 核对）。
成功写 EndpointId 到 *out_endpoint；失败返回 -Errno。
"""
[[function.param]]
name = "provider"
type = "u32"
[[function.param]]
name = "port_name"
type = "*const u8"
[[function.param]]
name = "port_name_len"
type = "usize"
[[function.param]]
name = "contract"
type = "u64"
[[function.param]]
name = "out_endpoint"
type = "*mut u64"

[[function]]
name = "kcore_endpoint_validate"
ret = "i32"
category = "Component endpoints（Contract / Endpoint）"
c_category = "Component endpoints（Contract / Endpoint）"
doc = """
只读校验一个已持有的 EndpointId：`(endpoint, contract, abi) → 0 / -Errno`。
实现是 `EndpointRegistry::lookup`——**contract + abi 都 exact-match**，并且
endpoint `Live`、owner 存在且 `Ready`（与发现路径同一套存活校验）。
无副作用、不分配、不改变任何状态；consumer 在取得 id 后核对契约身份用，
**不**替代 `kcore_endpoint_call` 的逐次存活解析（调用路径仍会重新校验存活）。
成功 = `0`；失败 = `-Errno`（`EINVAL` contract 或 abi 不符 /
`ENOENT` 未发布或 endpoint 已死 / `ENODEV` provider 已不存在）。
"""
c_doc = """
只读校验端点：contract + abi exact-match + 存活（lookup）。无副作用；
成功 = 0，失败 = -Errno（EINVAL 契约/ABI 不符；ENOENT 死端点；ENODEV provider 消失）。
"""
[[function.param]]
name = "endpoint"
type = "u64"
[[function.param]]
name = "contract"
type = "u64"
[[function.param]]
name = "abi"
type = "u64"

[[function]]
name = "kcore_endpoint_bind"
ret = "i32"
category = "Component endpoints（Contract / Endpoint）"
c_category = "Component endpoints（Contract / Endpoint）"
doc = """
**bind 时选定调用机制**（一次，之后不再按调用重决策；docs/architecture/deployment.md §2/§3）。
先做与 `kcore_endpoint_validate` 同一套校验（contract + abi **exact-match** + 存活：
endpoint `Live`、owner 存在且 `Ready`），再按 `(caller 执行域, provider 执行域)`
选定机制并写入 `*out_mechanism`（`KCORE_ENDPOINT_MECHANISM_DIRECT` /
`KCORE_ENDPOINT_MECHANISM_GATE`）：

- **Direct**：`*out_api` / `*out_ctx` 写入 provider 发布时交付的 function table 指针与
  opaque state（Core 原样传递、**不解引用**）。只有同域 KernelNative 才可能选中。
- **Gate**：`*out_api` / `*out_ctx` **不写**（保持调用方原值）；调用方改用
  `kcore_endpoint_call`（同一 `endpoint` id 即 call-gate handle）。

不支持的组合（跨特权 / 无法证明同 AS 且 syscall-IPC 未实现）→ `-ENOTSUP`；
**绝不静默降级成 Direct**。调用方不在任何组件执行边界内 → `-EPERM`；caller 已
`Failed` → `-EPERM`。Direct 选中但 provider 未交付 function table（`api` 为空）→
`-ENOTSUP`。成功 = `0`；失败 = `-Errno`（`EFAULT` 任一 out 为空 /
`EINVAL` contract 或 abi 不符 / `ENOENT` endpoint 未发布或已死 /
`ENODEV` provider 已不存在 / `ENOTSUP` 组合无已实现机制）。
"""
c_doc = """
bind 时由 Core 选定机制（一次）：校验 contract+abi exact-match + 存活后，同域
KernelNative → DIRECT（写 out_api / out_ctx）；否则 → GATE（不写 api/ctx，改用
kcore_endpoint_call）。不支持的组合返回 -ENOTSUP，绝不静默降级；无组件执行边界
返回 -EPERM。
"""
[[function.param]]
name = "endpoint"
type = "u64"
[[function.param]]
name = "contract"
type = "u64"
[[function.param]]
name = "abi"
type = "u64"
[[function.param]]
name = "out_mechanism"
type = "*mut u32"
[[function.param]]
name = "out_api"
type = "*mut usize"
[[function.param]]
name = "out_ctx"
type = "*mut usize"

[[function]]
name = "kcore_endpoint_call"
ret = "i32"
category = "Component endpoints（Contract / Endpoint）"
c_category = "Component endpoints（Contract / Endpoint）"
doc = """
调用一个 endpoint。**传输状态 ≠ 方法状态**：返回值是 Core 的**传输状态**
（`0` / `-Errno`）；provider 自己的 `i32` 返回写入 `*out_status`——**只在传输
返回 `0` 时有意义**。provider 返回的负 errno 绝不与 Core 生成的失败混淆。
`endpoint` 是组合期经 `kcore_endpoint_lookup` 取得的 opaque EndpointId
（发现路径只校验 contract + 存活；abi 由 `kcore_endpoint_validate` 核对；
**调用只重新校验存活**）；`method` / `port` 语义由 provider 定义，Core 从不解释。
`args` / `input` / `output` 是调用方的内存，只在本次调用期间借用：Core 只做
结构校验（长度非零时指针不得为空），**不解析其中的字节**。
provider = 当前 provider 实例：Core 校验其 `Ready` 并记 inflight；provider 停止 /
失败后 endpoint 永久死亡，绝不重定向到新实例。
**保留契约**：`SchedulerPolicy`（`scheduler.policy`）的 endpoint 不得经本入口调用
（`-EPERM`）——调度策略只能由 Core 的调度路径经专用 PolicyCall 边界执行，
组件不能把选中的调度算法当普通服务跑。
**执行边界已落地**：dispatcher 跑在 Core 拥有的 per-call service stack 上、处于
provider principal 之下，带 re-entry 检测与 provider panic containment（见
`component/call.rs` 模块文档）。
成功 = `0`（provider status 在 `*out_status`）；失败 = `-Errno`（`EFAULT`
`*out_status` 为空或 frame 结构非法；`EPERM` 无法解析 caller 或 caller 已
`Failed`；`ENOENT` endpoint 未发布或已死；`ENODEV` owner / image 已不存在；
`EBUSY` provider 不在 `Ready`、inflight 溢出或重入；`EINVAL` 调用链上有 IRQ
作用域；`ENOMEM` Core 无法分配 service stack；`EIO` provider 在边界内 panic
（已被标记 `Failed`，caller 存活）；`ENOSYS` image 没有 `kcomp_service_dispatch`）。
"""
c_doc = """
调用 endpoint。返回 Core 传输状态（0 / -Errno）；provider 自己的 i32 返回写入
*out_status（仅传输返回 0 时有意义）。dispatcher 在 Core 控制的 service 边界内
执行（per-call 栈 / provider principal / re-entry 与 IRQ 门禁 / panic containment）。
"""
[[function.param]]
name = "endpoint"
type = "u64"
[[function.param]]
name = "method"
type = "u32"
[[function.param]]
name = "args"
type = "*const u8"
[[function.param]]
name = "args_len"
type = "usize"
[[function.param]]
name = "input"
type = "*const u8"
[[function.param]]
name = "input_len"
type = "usize"
[[function.param]]
name = "output"
type = "*mut u8"
[[function.param]]
name = "output_len"
type = "usize"
[[function.param]]
name = "out_status"
type = "*mut i32"

