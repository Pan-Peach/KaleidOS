[[function]]
name = "kcore_trace_read"
ret = "i32"
category = "Trace / 时钟（只读观察面）"
c_category = "Trace（只读观察面；无写入口）"
doc = """
读 `seq >= since` 的第一条记录到 `out`，`out_next` 回写下一次应传的
`seq`。没有更多记录时返回 `-ENOENT`（**不返回 0**）。
"""
c_doc = """
读 `seq >= since` 的第一条记录；没有更多时返回 -ENOENT（不返回 0）。
"""
[[function.param]]
name = "since"
type = "u64"
[[function.param]]
name = "out"
type = "*mut TraceRecordAbi"
[[function.param]]
name = "out_next"
type = "*mut u64"

[[function]]
name = "kcore_trace_stats"
ret = "i32"
category = "Trace / 时钟（只读观察面）"
c_category = "Trace（只读观察面；无写入口）"
doc = """
读 Trace 子系统状态到 `out`。成功 = 0，失败 = `-Errno`（`EFAULT` 空指针）。
字段语义见 [`TraceStatsAbi`]。
"""
[[function.param]]
name = "out"
type = "*mut TraceStatsAbi"

[[function]]
name = "kcore_now"
ret = "u64"
category = "Trace / 时钟（只读观察面）"
c_category = "Clock（只读；无 authority 语义）"
doc = """
单调时钟（`rdtime` 的原始 tick）；频率见 [`kcore_timebase_hz`]。
真机 timebase 常是 10 MHz（1 tick = 100 ns）——测很短的操作要累积多次。
"""

[[function]]
name = "kcore_timebase_hz"
ret = "u64"
category = "Trace / 时钟（只读观察面）"
c_category = "Clock（只读；无 authority 语义）"
doc = """
时钟频率（Hz），用于把 tick 换算成时间。
"""

