name = "timestamp"
type = "u64"
doc = "平台时钟原始值（单位 / 来源见 `BENCH-ENV` 风格的环境描述）。"
offset = 8

[[struct.field]]
name = "kind"
type = "u32"
doc = "事件标签（见 trace 模块的 payload 分配表）。"
offset = 16

[[struct.field]]
name = "flags"
type = "u32"
doc = "保留；必须为 0。"
offset = 20

[[struct.field]]
name = "a"
type = "u64"
offset = 24

[[struct.field]]
name = "b"
type = "u64"
offset = 32

[[struct.field]]
name = "c"
type = "u64"
offset = 40

[[struct]]
name = "TraceStatsAbi"
c_name = "kcore_trace_stats"
doc = """
Trace 子系统状态的稳定编码（`kcore_trace_stats` 的 out 结构）。
`overwritten_total` 是**因 ring 满被逐出保留区**的记录总数（saturating），
不是"某个 reader 漏掉的条数"——reader 的真实缺口是 `returned_seq - requested_seq`。
"""
size = 40
align = 8

[[struct.field]]
name = "capacity"
type = "u64"
doc = "ring 容量（records）。"
offset = 0

[[struct.field]]
name = "oldest_seq"
type = "u64"
doc = "最旧存活记录的 `seq`；ring 为空时 == `next_seq`。"
offset = 8

[[struct.field]]
name = "next_seq"
type = "u64"
doc = "下一条记录将拿到的 `seq`。"
offset = 16

[[struct.field]]
name = "overwritten_total"
type = "u64"
doc = "因 ring 满被逐出保留区的记录总数。"
offset = 24

[[struct.field]]
name = "enabled_mask"
type = "u64"
doc = """
已使能事件掩码：bit i ↔ 事件 kind i+1；高位保留恒 0；默认全开，
`CONFIG_TRACE=n` 时恒 0。过滤只决定采集与否：不记录、不消耗 `seq`，不算丢失。
"""
offset = 32

[[struct]]
name = "MemoryView"
c_name = "kcore_memory_view"
doc = """
本执行域可访问的内存窗口（`kcore_memory_acquire` 的 out / `kcore_memory_release` 的 in）。
`kind` 是整数常量编码（见 `KCORE_MEMORY_VIEW_*`），不用 Rust enum layout；
`reserved` 保留、必须为 0。
**无账本**：Core 不为 region 建记录、不发 id、不记 owner——`view` 自身
（`base` / `len`）就是身份。
"""
size = 24
align = 8

[[struct.field]]
name = "kind"
type = "u32"
doc = "访问窗口编码：`KCORE_MEMORY_VIEW_LOCAL_VA` / `KCORE_MEMORY_VIEW_LINEAR_OFFSET`。"
offset = 0

[[struct.field]]
name = "reserved"
type = "u32"
doc = "保留；必须为 0。"
offset = 4

[[struct.field]]
name = "base"
type = "u64"
doc = "窗口基址（本域 VA；绝不返回物理地址或 Core 私有 VA）。"
offset = 8

[[struct.field]]
name = "len"
type = "u64"
doc = "窗口长度（字节；成功时 ≥ 请求的 `min_len`，实际粒度由 Core 决定）。"
offset = 16

