[[function]]
name = "kcore_endpoint_publish"
ret = "i32"
category = "Component endpoints（Contract / Endpoint）"
c_category = "Component endpoints（Contract / Endpoint）"
doc = """
发布一条 endpoint（**staged**：`kcomp_instance_create` 执行期间只记录 pending）。
provider = 当前正在创建的实例（Core 从 init 边界解析，**不信任组件自报身份**）。
`contract` 是组合策略提供的契约身份（不透明 `u64`）；`kind` / `abi` 由**首次发布**
建立契约真相，后续发布不一致在 commit 时拒绝；`port` 是 provider 定义的不透明
dispatch token（Core 从不解释）。端口名只要求在 **provider 实例内唯一**。
`api` / `ctx` 是 provider 交付的两种 transport：`api` 指向 provider 的
`#[repr(C)]` function table、`ctx` 是 provider opaque state（两者服务 **Direct**
路径：`kcore_endpoint_bind` 原样交付，Core 只存、**永不解引用**）；`port` + image 的
`kcomp_service_dispatch` 服务 **Gate** 路径。provider 提供哪种机制由 Core 在 bind
时按 `(caller domain, callee domain)` 选定，组件不得自行选择。
create 返回 0 后 Core 原子提交；本函数返回 `0` 只表示"已记录 pending"，
**不返回 EndpointId**（id 只在 commit 成功后存在，由 `kcore_endpoint_lookup` 发现）。
`Failed` provider / 不在 create 边界 → `-EPERM`；返回 `0 / -Errno`。
"""
c_doc = """
发布 endpoint（staged：init 期间只记录 pending；create 返回 0 后 Core 原子提交）。
provider 由当前 create 上下文解析，不信任组件自报身份；返回 0 不返回 EndpointId。
api/ctx 是 Direct 的 function table + state（Core 只存不解引用）；port 服务 Gate。
"""
[[function.param]]
name = "port_name"
type = "*const u8"
[[function.param]]
name = "port_name_len"
type = "usize"
[[function.param]]
name = "contract"
type = "u64"
[[function.param]]
name = "kind"
type = "u32"
[[function.param]]
