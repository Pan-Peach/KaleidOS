[[function]]
name = "kcore_endpoint_publish"
ret = "i32"
category = "Component endpoints（Contract / Endpoint）"
c_category = "Component endpoints（Contract / Endpoint）"
doc = """
发布一条 endpoint（**staged**：`kcomp_instance_create` 执行期间只记录 pending）。
provider = 当前正在创建的实例（Core 从 init 边界解析，**不信任组件自报身份**）。
`contract` 是组合策略提供的契约身份（不透明 `u64`）；`kind` / `abi` 由**首次发布**
建立契约真相，后续发布不一致在 commit 时拒绝；`port` 是 provider 定义的不透明
dispatch token（Core 从不解释）。端口名只要求在 **provider 实例内唯一**。
`api` / `ctx` 是 provider 交付的两种 transport：`api` 指向 provider 的
`#[repr(C)]` function table、`ctx` 是 provider opaque state（两者服务 **Direct**
路径：`kcore_endpoint_bind` 原样交付，Core 只存、**永不解引用**）；`port` + image 的
`kcomp_service_dispatch` 服务 **Gate** 路径。provider 提供哪种机制由 Core 在 bind
时按 `(caller domain, callee domain)` 选定，组件不得自行选择。
create 返回 0 后 Core 原子提交；本函数返回 `0` 只表示"已记录 pending"，
**不返回 EndpointId**（id 只在 commit 成功后存在，由 `kcore_endpoint_lookup` 发现）。
`Failed` provider / 不在 create 边界 → `-EPERM`；返回 `0 / -Errno`。
"""
c_doc = """
发布 endpoint（staged：init 期间只记录 pending；create 返回 0 后 Core 原子提交）。
provider 由当前 create 上下文解析，不信任组件自报身份；返回 0 不返回 EndpointId。
api/ctx 是 Direct 的 function table + state（Core 只存不解引用）；port 服务 Gate。
"""
[[function.param]]
name = "port_name"
type = "*const u8"
[[function.param]]
name = "port_name_len"
type = "usize"
[[function.param]]
name = "contract"
type = "u64"
[[function.param]]
name = "kind"
type = "u32"
[[function.param]]
name = "abi"
type = "u64"
[[function.param]]
name = "port"
type = "u32"
[[function.param]]
name = "api"
type = "*const void"
[[function.param]]
name = "ctx"
type = "*mut void"

[[function]]
name = "kcore_endpoint_lookup"
ret = "i32"
category = "Component endpoints（Contract / Endpoint）"
c_category = "Component endpoints（Contract / Endpoint）"
doc = """
组合期发现：`(provider, port_name, contract) → EndpointId`。
Core 校验的只有 **contract + 存活**（endpoint `Live` + owner 存在且 `Ready`）——
**不校验 abi**（本 ABI 不携带 abi）。交付的 EndpointId 是 opaque capability，
它的 abi 由 consumer 用 `kcore_endpoint_validate` 自行核对（SDK 的
`Endpoint<C>::from_id` / `lookup` 正是这样做的）。
成功 = `0`，EndpointId（`u64`）写入 `*out_endpoint`（调用方保证可写，任意对齐）；
失败 = `-Errno`（`EFAULT` out 为空 / `EINVAL` 名字非法·契约不符 /
`ENOENT` 未发布或 endpoint 已死 / `ENODEV` provider 已不存在）。
"""
c_doc = """
按 (provider, port_name, contract) 发现 endpoint：只校验 contract + 存活，
**不校验 abi**（id 是 opaque capability，abi 用 kcore_endpoint_validate 核对）。
成功写 EndpointId 到 *out_endpoint；失败返回 -Errno。
"""
[[function.param]]
name = "provider"
type = "u32"
[[function.param]]
name = "port_name"
type = "*const u8"
[[function.param]]
name = "port_name_len"
type = "usize"
[[function.param]]
name = "contract"
type = "u64"
[[function.param]]
name = "out_endpoint"
type = "*mut u64"

[[function]]
name = "kcore_endpoint_validate"
ret = "i32"
category = "Component endpoints（Contract / Endpoint）"
c_category = "Component endpoints（Contract / Endpoint）"
doc = """
只读校验一个已持有的 EndpointId：`(endpoint, contract, abi) → 0 / -Errno`。
实现是 `EndpointRegistry::lookup`——**contract + abi 都 exact-match**，并且
endpoint `Live`、owner 存在且 `Ready`（与发现路径同一套存活校验）。
无副作用、不分配、不改变任何状态；consumer 在取得 id 后核对契约身份用，
**不**替代 `kcore_endpoint_call` 的逐次存活解析（调用路径仍会重新校验存活）。
成功 = `0`；失败 = `-Errno`（`EINVAL` contract 或 abi 不符 /
`ENOENT` 未发布或 endpoint 已死 / `ENODEV` provider 已不存在）。
"""
c_doc = """
只读校验端点：contract + abi exact-match + 存活（lookup）。无副作用；
成功 = 0，失败 = -Errno（EINVAL 契约/ABI 不符；ENOENT 死端点；ENODEV provider 消失）。
"""
[[function.param]]
name = "endpoint"
type = "u64"
[[function.param]]
name = "contract"
type = "u64"
[[function.param]]
name = "abi"
type = "u64"

[[function]]
name = "kcore_endpoint_bind"
ret = "i32"
category = "Component endpoints（Contract / Endpoint）"
c_category = "Component endpoints（Contract / Endpoint）"
doc = """
**bind 时选定调用机制**（一次，之后不再按调用重决策；docs/architecture/deployment.md §2/§3）。
先做与 `kcore_endpoint_validate` 同一套校验（contract + abi **exact-match** + 存活：
endpoint `Live`、owner 存在且 `Ready`），再按 `(caller 执行域, provider 执行域)`
选定机制并写入 `*out_mechanism`（`KCORE_ENDPOINT_MECHANISM_DIRECT` /
`KCORE_ENDPOINT_MECHANISM_GATE`）：

- **Direct**：`*out_api` / `*out_ctx` 写入 provider 发布时交付的 function table 指针与
  opaque state（Core 原样传递、**不解引用**）。只有同域 KernelNative 才可能选中。
- **Gate**：`*out_api` / `*out_ctx` **不写**（保持调用方原值）；调用方改用
  `kcore_endpoint_call`（同一 `endpoint` id 即 call-gate handle）。

不支持的组合（跨特权 / 无法证明同 AS 且 syscall-IPC 未实现）→ `-ENOTSUP`；
**绝不静默降级成 Direct**。调用方不在任何组件执行边界内 → `-EPERM`；caller 已
`Failed` → `-EPERM`。Direct 选中但 provider 未交付 function table（`api` 为空）→
`-ENOTSUP`。成功 = `0`；失败 = `-Errno`（`EFAULT` 任一 out 为空 /
`EINVAL` contract 或 abi 不符 / `ENOENT` endpoint 未发布或已死 /
`ENODEV` provider 已不存在 / `ENOTSUP` 组合无已实现机制）。
"""
c_doc = """
bind 时由 Core 选定机制（一次）：校验 contract+abi exact-match + 存活后，同域
KernelNative → DIRECT（写 out_api / out_ctx）；否则 → GATE（不写 api/ctx，改用
kcore_endpoint_call）。不支持的组合返回 -ENOTSUP，绝不静默降级；无组件执行边界
返回 -EPERM。
"""
[[function.param]]
name = "endpoint"
type = "u64"
[[function.param]]
name = "contract"
type = "u64"
[[function.param]]
