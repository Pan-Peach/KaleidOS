认领确切设备：Core 记 owner，返回本执行域下的 MMIO 指针 + 长度。
KernelNative 下就是寄存器基址；driver 之后自己 volatile 读写。
"""
c_doc = """
认领确切设备：Core 记 owner，返回本执行域下的 MMIO 指针 + 长度。
"""
