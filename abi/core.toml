[[function]]
name = "kcore_memory_acquire"
ret = "i32"
category = "Memory resource（域视图，无账本）"
c_category = "Memory resource（域视图，无账本）"
doc = """
取一段内存 backing，返回**本执行域访问窗口**（`kind = KCORE_MEMORY_VIEW_LOCAL_VA`）。

`min_len > 0`、`min_align` 为非零 2 的幂；成功时 `view.len >= min_len`（实际
backing 粒度由 Core 决定，今天最小 4 KiB）。首次交付**零初始化**。
**无账本**：Core 不为 region 建记录、不发 id、不记 owner——`view` 自身
（`base` / `len`）就是身份；释放凭同一个 view 走 `kcore_memory_release`。
KernelNative 返回共享 AS 的 VA；Isolated 映射进调用实例的私有 AS，归属由映射
承载，不另立账本。Sandboxed 的原生直调入口返回 ENOTSUP（ecall 后端尚未接线）。
成功 = `0`（view 写入 `*out_view`）；失败 = `-Errno`（`EFAULT` out 为空 /
`EINVAL` size/align 非法 / `EOVERFLOW` `min_len` 超出本域指针宽 /
`ENOMEM` 物理内存耗尽）。
"""
c_doc = """
取一段内存 backing，返回本执行域访问窗口（kind = KCORE_MEMORY_VIEW_LOCAL_VA）：
min_len > 0、min_align 为非零 2 的幂；成功时 view.len >= min_len，首次交付零初始化。
无账本：不发 id、不记 owner，view 自身就是身份（释放凭同一 view 走 kcore_memory_release）。
KernelNative 给共享 AS 的 VA；Isolated 给实例私有 VA；Sandboxed 直调返回 ENOTSUP。
"""
[[function.param]]
name = "min_len"
type = "u64"
[[function.param]]
name = "min_align"
type = "u64"
[[function.param]]
name = "out_view"
type = "*mut MemoryView"

[[function]]
name = "kcore_memory_release"
ret = "i32"
category = "Memory resource（域视图，无账本）"
c_category = "Memory resource（域视图，无账本）"
doc = """
交回一个 `kcore_memory_acquire` 交付的 view：把 backing 归还分配器。

KernelNative 是**受信操作**（不校验归属、无账本），`(base, len)` 必须与 acquire
交付的 view 完全一致。成功 = `0`；
Isolated 只接受动态 backing 窗口内的精确映射；先 unmap、恢复共享 identity 别名，
再归还 physical extent。调用方保证无任务、回调或 DMA 继续借用；不接受 image/stack。
失败 = `-Errno`（`EFAULT` 空指针 / `EINVAL` kind 非法、`reserved` 非 0，
或 `(base, len)` 不是一次 acquire 产物的形状）。
"""
c_doc = """
交回一个 kcore_memory_acquire 交付的 view，把 backing 归还分配器。
KernelNative 受信操作；(base, len) 必须与 acquire 一致。
Isolated 按私有 AS 精确映射释放动态 backing，调用方保证无继续借用；不释放 image/stack。
"""
[[function.param]]
name = "view"
type = "*const MemoryView"

[[function]]
name = "kcore_heap_alloc"
ret = "*mut u8"
category = "KernelNative heap backend（部署后端；非通用内存 ABI）"
c_category = "KernelNative heap backend（KernelNative 部署后端；Isolated import 拒绝）"
category_group = "Memory resource（域视图，无账本）"
doc = """
**KernelNative 部署后端**：从 Core 共享堆（`memory::KernelAllocator`，slab + buddy）
分配 `size` 字节、`align` 对齐的内存。契约 = Rust `GlobalAlloc::alloc`。

**不是通用 / 跨域内存 ABI**：KernelNative 组件与 Core 同特权、同地址空间，所以共享
同一个堆（受信部署形态）；Isolated / Sandboxed 的装载**显式拒绝**这两个符号
（它们在自己的可写 image 里放私有分配器，backing 走
`kcore_memory_acquire/release`）。Core 不做 per-component 记账：不记 owner、
不设配额、失败不撤销（KernelNative 无隔离，记了也没有可裁决的对象）。

`size == 0`、非法 layout（`align` 非 2 的幂 / 为 0 / 溢出）或堆耗尽 → 返回 null
（**绝不 panic**）。成功返回的指针只能用 `kcore_heap_dealloc` 释放，且
`(size, align)` 必须与本次调用逐字一致（与 C `malloc/free` 错配同类 = UB）。
"""
c_doc = """
KernelNative 部署后端：从 Core 共享堆分配（size / align 同 Rust GlobalAlloc）。
size == 0 / 非法 align / 耗尽 → NULL；释放必须用 kcore_heap_dealloc 且 (size, align)
逐字一致。Isolated / Sandboxed 不解析该符号（私有分配器 + kcore_memory_acquire/release）。
"""
[[function.param]]
name = "size"
type = "usize"
[[function.param]]
name = "align"
type = "usize"

[[function]]
name = "kcore_heap_dealloc"
ret = "i32"
category = "KernelNative heap backend（部署后端；非通用内存 ABI）"
c_category = "KernelNative heap backend（KernelNative 部署后端；Isolated import 拒绝）"
category_group = "Memory resource（域视图，无账本）"
doc = """
**KernelNative 部署后端**：归还一次 `kcore_heap_alloc` 的分配。契约 = Rust
`GlobalAlloc::dealloc`——`(ptr, size, align)` 必须与那次成功 alloc **逐字一致**：
共享堆按 `Layout` 路由 slab / buddy，**不得**从取整后的容量反推（违反 = UB）。

成功 = `0`；失败 = `-Errno`（`EFAULT` 空指针 / `EINVAL` 非法或 `size == 0` 的
layout——没有一次成功的 alloc 会产出这种形状）。释放只回到共享堆：不撤销、不记账。
"""
c_doc = """
KernelNative 部署后端：归还一次 kcore_heap_alloc（ptr / size / align 必须逐字一致；
Layout 驱动 slab / buddy 路由，不得从取整容量反推）。成功 = 0，失败 = -Errno。
"""
[[function.param]]
name = "ptr"
type = "*mut u8"
[[function.param]]
name = "size"
type = "usize"
[[function.param]]
name = "align"
type = "usize"

