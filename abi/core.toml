[[function.param]]
name = "out_instance"
type = "*mut u32"

[[function]]
name = "kcore_component_load"
ret = "i32"
doc = "请求按 domain 部署默认配置的组件。返回 ComponentId raw / -errno；Core 验证并提交，不静默降级。"
