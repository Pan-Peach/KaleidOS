# KABI schema — core：`kcore_*` 导出面 + Core 侧边界结构 / 常量。
#
# 生成物（提交物，不要手改；`make abi-gen` 重生成，`make abi-check` 校验）：
#   os/components/kcomp-sdk/include/generated/kcomp_abi.h   C 声明 + _Static_assert
#   os/components/kcomp-sdk/src/generated/abi.rs            SDK-Rust 镜像（extern 块）
#   os/core/src/generated/abi.rs                            Core 边界结构 / 常量
#   os/core/src/component/generated/exports.rs              Core 导出注册表（typed refs）
#
# 手写部分（facade / umbrella / Core 实现 / 语义转换）不在本文件范围内。
# 结构布局断言是编译器背书的：C `_Static_assert` + Rust `const _: () = assert!(...)`。

[[struct]]
name = "TraceRecordAbi"
c_name = "kcore_trace_record"
doc = """
一条 trace 记录的**稳定编码**（Core `trace::abi::TraceRecordAbi`）。
`kind` 决定 `a` / `b` / `c` 的含义，缺省字段写成 `ABSENT`（**不是** 0）。
"""
size = 48
align = 8

[[struct.field]]
name = "seq"
type = "u64"
doc = "Core 分配的单调序号（**排序与断言的唯一依据**）。"
offset = 0

[[struct.field]]
name = "timestamp"
type = "u64"
doc = "平台时钟原始值（单位 / 来源见 `BENCH-ENV` 风格的环境描述）。"
offset = 8

[[struct.field]]
name = "kind"
type = "u32"
doc = "事件标签（见 trace 模块的 payload 分配表）。"
offset = 16

[[struct.field]]
name = "flags"
type = "u32"
doc = "保留；必须为 0。"
offset = 20

[[struct.field]]
name = "a"
type = "u64"
offset = 24

[[struct.field]]
name = "b"
type = "u64"
offset = 32

[[struct.field]]
name = "c"
type = "u64"
offset = 40

[[struct]]
name = "TraceStatsAbi"
c_name = "kcore_trace_stats"
doc = """
Trace 子系统状态的稳定编码（`kcore_trace_stats` 的 out 结构）。
`overwritten_total` 是**因 ring 满被逐出保留区**的记录总数（saturating），
不是"某个 reader 漏掉的条数"——reader 的真实缺口是 `returned_seq - requested_seq`。
"""
size = 40
align = 8

[[struct.field]]
name = "capacity"
type = "u64"
doc = "ring 容量（records）。"
offset = 0

[[struct.field]]
name = "oldest_seq"
type = "u64"
doc = "最旧存活记录的 `seq`；ring 为空时 == `next_seq`。"
offset = 8

[[struct.field]]
name = "next_seq"
type = "u64"
doc = "下一条记录将拿到的 `seq`。"
offset = 16

[[struct.field]]
name = "overwritten_total"
type = "u64"
doc = "因 ring 满被逐出保留区的记录总数。"
offset = 24

[[struct.field]]
name = "enabled_mask"
type = "u64"
doc = """
已使能事件掩码：bit i ↔ 事件 kind i+1；高位保留恒 0；默认全开，
`CONFIG_TRACE=n` 时恒 0。过滤只决定采集与否：不记录、不消耗 `seq`，不算丢失。
"""
offset = 32

