[workspace]
resolver = "2"
members = [
    "os/core",
    "os/arch",
    "os/components/scheduler_rr",
    "os/components/tests/core_test",
    "os/components/logger",
]
exclude = [
    "third_party/buddy_system_allocator",
    "third_party/fdt",
    # 组件 SDK：独立 workspace（自带 #![no_std] + 裸机 panic handler），
    # root 成员以 path 依赖引用；不参与 host workspace 的 test/clippy。
    "os/components/kcomp-sdk",
]
