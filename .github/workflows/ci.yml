name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  # 快车道：fmt + clippy + host tests + 交叉构建（不跑 QEMU）
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Init submodules
        run: git submodule update --init --recursive
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install RISC-V targets, rustfmt, clippy
        run: |
          rustup target add riscv64gc-unknown-none-elf
          rustup target add riscv32imac-unknown-none-elf
          rustup component add rustfmt clippy
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            os/boot/riscv -> ../../../build
      - name: Install exec fixture compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-unknown-elf clang llvm
      - name: Make check
        run: make check

  # QEMU 车道：RV64/RV32 CoreTest + init/ksh 启动流程（慢，独立 job）
  qemu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Init submodules
        run: git submodule update --init --recursive
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install RISC-V targets
        run: |
          rustup target add riscv64gc-unknown-none-elf
          rustup target add riscv32imac-unknown-none-elf
      - name: Install QEMU and FAT image tools
        run: sudo apt-get update && sudo apt-get install -y qemu-system-misc dosfstools mtools gcc-riscv64-unknown-elf clang llvm
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            os/boot/riscv -> ../../../build
      - name: Make test-qemu
        run: make test-qemu
      - name: Upload QEMU logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-logs
          path: build/tests/**/logs/

  # ArchTest 白盒车道：feature-gated selftest（每 case 独立 QEMU，慢，独立 job）
  archtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Init submodules
        run: git submodule update --init --recursive
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install RISC-V targets
        run: |
          rustup target add riscv64gc-unknown-none-elf
          rustup target add riscv32imac-unknown-none-elf
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-misc gcc-riscv64-unknown-elf clang llvm
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            os/boot/riscv -> ../../../build
      - name: Make test-arch
        run: make test-arch
      - name: Upload ArchTest logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: archtest-logs
          path: build/tests/**/logs/
