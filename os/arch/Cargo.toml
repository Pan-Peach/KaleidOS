[package]
name = "arch"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["supervisor", "vm-mmu"]
supervisor = []
machine = []

vm-mmu = []
vm-nommu = []

# SMP 后端机制（CPU 启动 + IPI 传输）。SMP 骨架：接口已定、实现 todo!()。
# 由 Kconfig 的 CONFIG_SMP 经 genmk.py 映射进来（见 docs/architecture/kconfig.md）。
smp = []

[dependencies]
bitflags = { version = "2", default-features = false }

[target.'cfg(any(target_arch = "riscv32", target_arch = "riscv64"))'.dependencies]
sbi-rt = { version = "0.0.4", default-features = false, features = ["legacy"] }
