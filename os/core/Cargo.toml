[package]
name = "kernel"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[features]
default = ["supervisor", "vm-mmu", "trace"]
supervisor = ["arch/supervisor"]
machine = ["arch/machine"]
vm-mmu = ["arch/vm-mmu"]
vm-nommu = ["arch/vm-nommu"]
preempt = []
# Explicit host integration suite; artifacts are prepared by make test-host.
test-fixtures = []
# Structured Core trace (CONFIG_TRACE).  `default` so host tests can assert on
# event sequences; target builds get it only through KCFG_BOOT_FEATURES.
trace = []

[dependencies]
arch = { path = "../arch", default-features = false }
buddy_system_allocator = { path = "../../third_party/buddy_system_allocator", default-features = false, features = ["alloc", "use_spin", "metadata_heap"] }
spin = { version = "0.12.1", default-features = false, features = ["spin_mutex", "rwlock","once"] }

[dev-dependencies]
# 仅 host test profile：AddressSpace 随机序列 + parser never-panic（docs/development/testing.md §2）
proptest = "1"
