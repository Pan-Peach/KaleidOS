[package]
name = "kcomp_isolated_life"
version = "0.1.0"
edition = "2024"
publish = false

# 组件是独立编译单元：不加入 workspace（它们的 Cargo 依赖图 ≠ 运行时组件图）。
[workspace]

# increment 5 ArchTest 夹具：真实 `.kcomp`，**刻意零依赖、零 import**——
# Isolated 的 import 包络仍是空集（`docs/architecture/deployment.md` §6.1）。
[lib]
crate-type = ["staticlib"]
