[package]
name = "kcomp-sdk"
version = "0.1.0"
edition = "2024"
publish = false

# 组件 SDK / CRT：随 .kcomp 私有携带（编译进组件镜像），不是可加载组件本身，
# 因此不加入 Makefile 的组件列表（KCOMP_SRCS）。独立 workspace：root 侧用 exclude 隔离，
# 既让 root 成员（core_test / scheduler_rr）能 path 依赖，又让 standalone
# 组件（kcomp_smoke / kcomp_min / kcomp_panic）能 path 依赖。
[workspace]

[features]
default = []
# opt-in：启用 GlobalAlloc；Core 在 create 前选择共享堆或实例私有堆。
# 非 alloc 组件保持精简，不拉入这条路径。
alloc = []

[dependencies]
