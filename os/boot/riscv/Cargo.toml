[package]
name = "bootstrap"
version = "0.1.0"
edition = "2021"

# 独立于根 workspace（当前是 M0 实验 crate，不进主构建）
[workspace]

[[bin]]
name = "bootstrap"
path = "src/main.rs"
test = false   # 裸机 riscv 目标无 test crate，禁止 rust-analyzer 跑 --tests

[features]
default = ["supervisor"]
supervisor = ["arch/supervisor", "kernel/supervisor"]
machine = ["arch/machine", "kernel/machine"]
selftest = []

[dependencies]
arch = { path = "../../arch", default-features = false }
fdt = { path = "../../../third_party/fdt" }
kernel = { path = "../../core", default-features = false }
spin = { version = "0.12.1", default-features = false, features = ["spin_mutex", "once"] }

[profile.release]
panic = "abort"        # 裸机没有 unwinding，panic 直接停
